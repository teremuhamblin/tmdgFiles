<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="960" height="540" fill="#0b0f16"/>

  <!-- Grid -->
  <g stroke="#1a2535" stroke-width="0.5" opacity="0.35">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none"/>
      </pattern>
    </defs>
    <rect width="960" height="540" fill="url(#grid)"/>
  </g>

  <!-- Outer frame -->
  <rect x="40" y="40" width="880" height="460" fill="none" stroke="#3af0a0" stroke-width="1.5" rx="8"/>

  <!-- Title bar -->
  <rect x="60" y="60" width="840" height="40" fill="#0b0f16" stroke="#3af0a0" stroke-width="1"/>
  <text x="80" y="86" font-family="Consolas, monospace" font-size="20" fill="#3af0a0">
    tmdgFiles :: DEMO HUD
  </text>

  <!-- Left panel -->
  <rect x="80" y="120" width="240" height="340" fill="#0b0f16" stroke="#3af0a0" stroke-width="1"/>
  <text x="96" y="146" font-family="Consolas, monospace" font-size="14" fill="#3af0a0">
    /home/major/tmdgFiles
  </text>

  <!-- Left items -->
  <g font-family="Consolas, monospace" font-size="13" fill="#c9d5e8">
    <text x="96" y="176">src/</text>
    <text x="96" y="196">docs/</text>
    <text x="96" y="216">assets/</text>
    <text x="96" y="236">target/</text>
    <text x="96" y="256">Cargo.toml</text>
    <text x="96" y="276">README.md</text>
    <text x="96" y="296">INSTALL.md</text>
    <text x="96" y="316">BUILD.md</text>
    <text x="96" y="336">PACKAGE.md</text>
    <text x="96" y="356">install.sh</text>
  </g>

  <!-- Highlight -->
  <rect x="88" y="266" width="224" height="20" fill="#102030" stroke="#3af0a0" stroke-width="0.6"/>
  <text x="96" y="280" font-family="Consolas, monospace" font-size="13" fill="#3af0a0">
    README.md  &lt;selected&gt;
  </text>

  <!-- Main panel -->
  <rect x="340" y="120" width="540" height="340" fill="#0b0f16" stroke="#3af0a0" stroke-width="1"/>

  <!-- Logo -->
  <text x="380" y="188" font-family="Consolas, monospace" font-size="32" fill="#4af">
    tmdg<span fill="#7ff542">Files</span>
  </text>

  <!-- Demo steps -->
  <g font-family="Consolas, monospace" font-size="13">
    <text x="600" y="160" fill="#3af0a0">DEMO SEQUENCE</text>
    <text x="600" y="184" fill="#c9d5e8">1. Launch tmdgFiles</text>
    <text x="600" y="204" fill="#c9d5e8">2. Navigate /home/major</text>
    <text x="600" y="224" fill="#c9d5e8">3. Apply tags</text>
    <text x="600" y="244" fill="#c9d5e8">4. Run mission</text>
    <text x="600" y="264" fill="#c9d5e8">5. Confirm</text>
  </g>

  <!-- Bottom bar -->
  <rect x="60" y="460" width="840" height="40" fill="#0b0f16" stroke="#3af0a0" stroke-width="1"/>
  <text x="80" y="486" font-family="Consolas, monospace" font-size="13" fill="#3af0a0">
    tmdgFiles :: Rust + GTK4 :: Linux Native :: OPS READY
  </text>

</svg>
