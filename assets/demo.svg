<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2635" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="0.35"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="880" height="460" fill="none" stroke="#3af0a0" stroke-width="1.5" rx="8"/>
  <rect x="60" y="60" width="840" height="420" fill="none" stroke="#1fd38a" stroke-width="1" rx="6" opacity="0.7"/>

  <!-- Title bar -->
  <rect x="60" y="60" width="840" height="40" fill="#050b12" stroke="#1fd38a" stroke-width="0.8"/>
  <text x="80" y="86" font-family="Consolas, monospace" font-size="20" fill="#3af0a0">
    tmdgFiles :: DEMO HUD
  </text>
  <circle cx="860" cy="80" r="5" fill="#3af0a0"/>
  <circle cx="880" cy="80" r="5" fill="#f0c53a"/>
  <circle cx="900" cy="80" r="5" fill="#f05454"/>

  <!-- Left panel (filesystem) -->
  <rect x="80" y="120" width="240" height="340" fill="#050b12" stroke="#1fd38a" stroke-width="0.8"/>
  <text x="96" y="146" font-family="Consolas, monospace" font-size="14" fill="#3af0a0">
    /home/major/tmdgFiles
  </text>

  <!-- Left panel items -->
  <g font-family="Consolas, monospace" font-size="13" fill="#c9d5e8">
    <text x="96" y="176">src/</text>
    <text x="96" y="196">docs/</text>
    <text x="96" y="216">assets/</text>
    <text x="96" y="236">target/</text>
    <text x="96" y="256">Cargo.toml</text>
    <text x="96" y="276">README.md</text>
    <text x="96" y="296">INSTALL.md</text>
    <text x="96" y="316">BUILD.md</text>
    <text x="96" y="336">PACKAGE.md</text>
    <text x="96" y="356">install.sh</text>
  </g>

  <!-- Highlighted item -->
  <rect x="88" y="266" width="224" height="20" fill="#102030" stroke="#3af0a0" stroke-width="0.6" opacity="0.8"/>
  <text x="96" y="280" font-family="Consolas, monospace" font-size="13" fill="#3af0a0">
    README.md  &lt;selected&gt;
  </text>

  <!-- Main panel (demo content) -->
  <rect x="340" y="120" width="540" height="340" fill="#050b12" stroke="#1fd38a" stroke-width="0.8"/>

  <!-- Logo area -->
  <rect x="360" y="140" width="220" height="80" fill="none" stroke="#3af0a0" stroke-width="0.7" rx="4"/>
  <text x="380" y="188" font-family="Consolas, monospace" font-size="32" fill="#4af">
    tmdg<span fill="#7ff542">Files</span>
  </text>

  <!-- Demo steps (right side) -->
  <g font-family="Consolas, monospace" font-size="13">
    <text x="600" y="160" fill="#3af0a0">DEMO SEQUENCE</text>
    <text x="600" y="184" fill="#c9d5e8">1. Launch tmdgFiles</text>
    <text x="600" y="204" fill="#c9d5e8">2. Navigate /home/major</text>
    <text x="600" y="224" fill="#c9d5e8">3. Apply tags to files</text>
    <text x="600" y="244" fill="#c9d5e8">4. Run mission: copy batch</text>
    <text x="600" y="264" fill="#c9d5e8">5. Confirm operations</text>
  </g>

  <!-- Tag system visualization -->
  <rect x="360" y="240" width="220" height="80" fill="none" stroke="#3af0a0" stroke-width="0.7" rx="4"/>
  <text x="372" y="262" font-family="Consolas, monospace" font-size="13" fill="#3af0a0">
    TAGS SYSTEM
  </text>
  <circle cx="380" cy="284" r="6" fill="#7ff542"/>
  <text x="394" y="288" font-family="Consolas, monospace" font-size="12" fill="#c9d5e8">
    important
  </text>
  <circle cx="380" cy="306" r="6" fill="#f0c53a"/>
  <text x="394" y="310" font-family="Consolas, monospace" font-size="12" fill="#c9d5e8">
    work
  </text>

  <!-- Mission system visualization -->
  <rect x="360" y="340" width="220" height="80" fill="none" stroke="#3af0a0" stroke-width="0.7" rx="4"/>
  <text x="372" y="362" font-family="Consolas, monospace" font-size="13" fill="#3af0a0">
    MISSION SYSTEM
  </text>
  <text x="372" y="384" font-family="Consolas, monospace" font-size="12" fill="#c9d5e8">
    Mission: COPY_TO /mnt/storage
  </text>
  <text x="372" y="404" font-family="Consolas, monospace" font-size="12" fill="#c9d5e8">
    Status: READY
  </text>

  <!-- Bottom status bar -->
  <rect x="60" y="460" width="840" height="40" fill="#050b12" stroke="#1fd38a" stroke-width="0.8"/>
  <text x="80" y="486" font-family="Consolas, monospace" font-size="13" fill="#3af0a0">
    tmdgFiles :: Rust + GTK4 :: Linux Native :: OPS READY
  </text>
  <text x="720" y="486" font-family="Consolas, monospace" font-size="12" fill="#c9d5e8">
    demo.svg :: v1.0
  </text>

  <!-- Subtle scan line -->
  <rect x="40" y="220" width="880" height="2" fill="#3af0a0" opacity="0.15"/>
</svg>
